<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivex VIP | Trade AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#F0C040;--gold-dim:#7a6020;
  --green:#00FF9D;--red:#FF3D5A;--blue:#00D4FF;
  --bg:#07070F;--bg2:#0D0C1A;--bg3:#0a0d18;
  --border:rgba(201,168,76,0.18);--text:#EDE5CC;--text2:rgba(237,229,204,0.48);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);min-height:100vh;position:relative;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,80,160,0.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,80,160,0.09) 1px,transparent 1px),
    radial-gradient(ellipse 80% 55% at 80% 0%,rgba(0,80,180,0.13) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 5% 95%,rgba(0,212,255,0.05) 0%,transparent 55%);
  background-size:44px 44px,44px 44px,100% 100%,100% 100%;
}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,7,15,0.0) 0%,rgba(7,7,15,0.55) 100%);}

.page{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:0 15px 60px;}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:26px 0 22px;border-bottom:1px solid var(--border);margin-bottom:26px;}
.logo{display:flex;align-items:center;gap:13px;}
.logo-box{width:68px;height:68px;border-radius:50%;position:relative;overflow:hidden;flex-shrink:0;cursor:pointer;box-shadow:0 0 0 2px rgba(201,168,76,0.45),0 0 32px rgba(201,168,76,0.28);transition:box-shadow .4s;}
.logo-box img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transition:transform .4s;filter:brightness(1.15) contrast(1.08) saturate(1.1);}
.logo-box::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 60%,rgba(201,168,76,0.55) 75%,rgba(255,210,80,0.8) 80%,transparent 95%);animation:logoSpin 3.2s linear infinite;z-index:2;pointer-events:none;}
@keyframes logoSpin{to{transform:rotate(360deg)}}
.logo-box::before{content:'';position:absolute;inset:3px;border-radius:50%;background:rgba(7,7,15,0.25);z-index:1;pointer-events:none;}
.logo-burst{animation:logoBurst 1.1s cubic-bezier(.22,1,.36,1) both;}
@keyframes logoBurst{0%{transform:scale(0) rotate(-180deg);opacity:0;}60%{transform:scale(1.18) rotate(8deg);opacity:1;box-shadow:0 0 45px 12px rgba(201,168,76,0.5);}100%{transform:scale(1) rotate(0deg);}}
.logo-box:hover{box-shadow:0 0 0 2.5px var(--gold),0 0 40px rgba(201,168,76,0.5);}
.logo-box:hover img{transform:scale(1.08);}
@keyframes clickPulse{0%{box-shadow:0 0 0 0 rgba(0,212,255,0.6);}50%{box-shadow:0 0 0 14px rgba(0,212,255,0.15);}100%{box-shadow:0 0 0 0 rgba(0,212,255,0);}}
.logo-box.pulse-click{animation:clickPulse .55s ease;}
.logo-txts{display:flex;flex-direction:column;gap:2px;}
.logo-name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:19px;letter-spacing:3px;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-vip{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;background:linear-gradient(90deg,#00D4FF,#7B5FFF,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
.logo-sub{font-size:10px;color:var(--text2);letter-spacing:1.5px;}

/* ── Lang toggle ── */
.lang-tog{display:flex;gap:5px;}
.lopt{font-size:11px;font-weight:700;letter-spacing:1px;width:36px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:var(--text2);border:1px solid rgba(201,168,76,0.18);background:var(--bg3);transition:all .2s;user-select:none;}
.lopt.active{background:linear-gradient(135deg,var(--gold-dim),var(--gold));color:#07070F;border-color:var(--gold);}

/* ── Selects ── */
.flabel{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;display:block;}
.swrap{position:relative;margin-bottom:20px;}
.swrap::after{content:'\25be';position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-size:14px;pointer-events:none;}
[dir=rtl] .swrap::after{left:15px;}
[dir=ltr] .swrap::after{right:15px;}
select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Cairo',sans-serif;font-size:14px;font-weight:500;padding:14px 17px;appearance:none;cursor:pointer;outline:none;transition:border-color .2s,box-shadow .2s;}
select:focus,select:hover{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.07);}
option{background:#0D0C1A;}

/* ── Signal button ── */
.sig-btn{
  width:100%;padding:12px 16px;border:none;border-radius:11px;
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  margin-bottom:20px;transition:all .35s;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a1208,#2e2010,#1a1208);
  color:var(--gold);
  border:1px solid rgba(201,168,76,0.35);
  box-shadow:0 2px 12px rgba(201,168,76,0.10);
  letter-spacing:1px;
}
.sig-btn:hover{
  background:linear-gradient(135deg,#221808,#3a2a12,#221808);
  box-shadow:0 4px 18px rgba(201,168,76,0.22);
  border-color:rgba(201,168,76,0.55);
  transform:translateY(-1px);
}
.sig-btn:active{transform:translateY(0px);}
.sig-btn.waiting{
  background:linear-gradient(135deg,#060e1e,#0b1628,#060e1e);
  color:var(--blue);
  border:1px solid rgba(0,212,255,0.22);
  box-shadow:0 0 16px rgba(0,212,255,0.08);
  animation:wp 1.4s ease-in-out infinite;
}
@keyframes wp{0%,100%{box-shadow:0 0 12px rgba(0,212,255,0.06)}50%{box-shadow:0 0 22px rgba(0,212,255,0.18)}}

/* wait-locked button */
.sig-btn.locked{
  background:linear-gradient(135deg,#0e0a04,#1a1106,#0e0a04);
  color:rgba(201,168,76,0.45);
  border:1px solid rgba(201,168,76,0.12);
  box-shadow:none;
  cursor:not-allowed;
  transform:none!important;
}

.spn{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,212,255,0.2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-inline-end:7px;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Signal card ── */
.sig-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  margin-bottom:20px;overflow:hidden;transition:border-color .4s,box-shadow .4s;
}
.sig-card.buy{border-color:rgba(0,255,157,0.32);box-shadow:0 0 22px rgba(0,255,157,0.06);}
.sig-card.sell{border-color:rgba(255,61,90,0.32);box-shadow:0 0 22px rgba(255,61,90,0.06);}
.sc-head{display:flex;align-items:center;justify-content:space-between;padding:10px 17px;border-bottom:1px solid var(--border);}
.sc-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px;}

/* ── Time badge ── */
.sc-time-wrap{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,20,55,0.7);
  border:1px solid rgba(0,100,200,0.35);
  border-radius:7px;
  padding:3px 10px;
  box-shadow:0 0 10px rgba(0,100,200,0.18),inset 0 0 6px rgba(0,140,255,0.06);
}
.sc-time-dot{width:5px;height:5px;border-radius:50%;background:rgba(0,180,255,0.7);box-shadow:0 0 6px rgba(0,180,255,0.8);animation:tdot 1.4s ease-in-out infinite;}
@keyframes tdot{0%,100%{opacity:0.5;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);}}
.sc-time{font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,200,255,0.85);letter-spacing:1.5px;font-weight:700;}

/* ── Signal body ── */
.sc-body{padding:14px 17px;text-align:center;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.idle-txt{font-size:13px;color:var(--text2);}
.res{display:none;flex-direction:column;align-items:center;gap:8px;width:100%;}
.res-pair{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--text2);}

/* ── Direction pill ── */
.res-dir-wrap{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:9px 28px;border-radius:12px;
  transition:all .35s;
}
.res-dir-wrap.buy{
  background:rgba(0,255,157,0.07);
  border:1px solid rgba(0,255,157,0.25);
  box-shadow:0 0 20px rgba(0,255,157,0.08),inset 0 0 12px rgba(0,255,157,0.04);
}
.res-dir-wrap.sell{
  background:rgba(255,61,90,0.07);
  border:1px solid rgba(255,61,90,0.25);
  box-shadow:0 0 20px rgba(255,61,90,0.08),inset 0 0 12px rgba(255,61,90,0.04);
}
.dir-arrow{font-size:22px;line-height:1;transition:all .3s;filter:drop-shadow(0 0 8px currentColor);}
.dir-arrow.buy{color:var(--green);}
.dir-arrow.sell{color:var(--red);}
.res-dir{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;transition:all .3s;}
.res-dir.buy{color:var(--green);text-shadow:0 0 14px rgba(0,255,157,0.5);}
.res-dir.sell{color:var(--red);text-shadow:0 0 14px rgba(255,61,90,0.5);}
.res-dir-wrap.buy .dir-arrow{animation:buyPulse 1.8s ease-in-out infinite;}
.res-dir-wrap.sell .dir-arrow{animation:sellPulse 1.8s ease-in-out infinite;}
@keyframes buyPulse{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes sellPulse{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}

/* ── Meta row with signal countdown ── */
.res-meta{display:flex;gap:16px;font-size:12px;color:var(--text2);align-items:center;flex-wrap:wrap;justify-content:center;}
.res-meta span{color:var(--text);font-weight:700;}
.res-meta .acc{color:var(--gold-light)!important;}

/* ── Signal countdown box (next to signal) ── */
.sig-countdown-box{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(4,6,18,0.85);
  border:1px solid rgba(201,168,76,0.15);
  border-radius:7px;
  padding:3px 8px;
  backdrop-filter:blur(4px);
  transition:all .3s;
}
.sig-countdown-box.hidden{display:none;}
.sig-countdown-box.buy-c{border-color:rgba(0,255,157,0.22);box-shadow:0 0 8px rgba(0,255,157,0.08);}
.sig-countdown-box.sell-c{border-color:rgba(255,61,90,0.22);box-shadow:0 0 8px rgba(255,61,90,0.08);}
.sig-cd-label{font-size:9px;color:var(--text2);letter-spacing:1px;}
.sig-cd-val{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1px;color:rgba(240,192,64,0.9);
  min-width:28px;text-align:center;
}
.sig-cd-val.buy-v{color:rgba(0,255,157,0.9);}
.sig-cd-val.sell-v{color:rgba(255,61,90,0.9);}

/* ── Wait overlay toast ── */
.wait-toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);z-index:999;
  background:rgba(6,10,26,0.96);border:1px solid rgba(201,168,76,0.28);border-radius:12px;
  padding:10px 20px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 18px rgba(201,168,76,0.08);
  backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.22,1,.36,1);
  min-width:220px;max-width:320px;
}
.wait-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.wt-title{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.5px;margin-bottom:5px;}
.wt-cd{
  font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
  color:rgba(0,212,255,0.9);letter-spacing:3px;
  text-shadow:0 0 12px rgba(0,212,255,0.5);
  line-height:1;
}
.wt-sub{font-size:10px;color:var(--text2);margin-top:4px;letter-spacing:1px;}

/* ── Chart section ── */
.chart-sec{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;}
.chart-head{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid var(--border);}
.chart-ttl{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.chart-badge{font-size:11px;color:var(--text2);}
#chartbox{width:100%;height:300px;background:transparent;position:relative;}

/* ── Candle countdown timer ── */
.candle-timer{
  position:absolute;top:10px;z-index:15;
  font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;
  color:rgba(0,212,255,0.9);
  background:rgba(4,8,22,0.82);
  border:1px solid rgba(0,212,255,0.22);
  border-radius:8px;
  padding:4px 11px;
  letter-spacing:2px;
  pointer-events:none;
  backdrop-filter:blur(6px);
  box-shadow:0 0 12px rgba(0,212,255,0.15);
  text-shadow:0 0 8px rgba(0,212,255,0.6);
}
[dir=rtl] .candle-timer{left:12px;}
[dir=ltr] .candle-timer{right:12px;}

/* ── Pocket Option badge ── */
.po-badge{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;
  display:flex;align-items:center;gap:7px;
  background:rgba(4,6,18,0.88);border:1px solid rgba(0,180,255,0.22);border-radius:10px;
  padding:5px 12px 5px 8px;backdrop-filter:blur(8px);
  box-shadow:0 0 18px rgba(0,120,255,0.18),inset 0 0 8px rgba(0,180,255,0.04);
}
.po-logo-img{width:26px;height:26px;border-radius:6px;object-fit:cover;filter:brightness(1.1) saturate(1.2);box-shadow:0 0 8px rgba(0,180,255,0.35);flex-shrink:0;}
.po-texts{display:flex;flex-direction:column;gap:1px;}
.po-name{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;color:rgba(255,255,255,0.75);letter-spacing:2px;text-shadow:0 0 8px rgba(0,200,255,0.5);}
.po-sub{font-family:'Cairo',sans-serif;font-size:8px;color:rgba(0,212,255,0.5);letter-spacing:1px;}

/* ── Signal arrows ── */
.chart-arrow{position:absolute;z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:0px;animation:arrowPop .5s cubic-bezier(.22,1,.36,1) both;}
.arrow-head{font-size:24px;font-weight:900;line-height:1;}
.arrow-body{width:3px;height:52px;border-radius:2px;}
.chart-arrow.up .arrow-head{color:var(--green);text-shadow:0 0 14px rgba(0,255,157,0.9),0 0 28px rgba(0,255,157,0.5);}
.chart-arrow.up .arrow-body{background:linear-gradient(180deg,rgba(0,255,157,0.7),rgba(0,255,157,0.05));}
.chart-arrow.down .arrow-head{color:var(--red);text-shadow:0 0 14px rgba(255,61,90,0.9),0 0 28px rgba(255,61,90,0.5);}
.chart-arrow.down .arrow-body{background:linear-gradient(0deg,rgba(255,61,90,0.7),rgba(255,61,90,0.05));}
@keyframes arrowPop{from{opacity:0;transform:scale(0.2) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes arrowFade{from{opacity:1}to{opacity:0;transform:translateY(-18px)}}
.chart-arrow.fading{animation:arrowFade .7s ease forwards;}

/* ── Footer ── */
.ftr{margin-top:28px;text-align:center;padding-top:18px;border-top:1px solid var(--border);}
.ftr-copy{font-size:10px;color:var(--text2);letter-spacing:2px;}
.ftr-rights{margin-top:10px;font-size:11px;font-weight:600;color:rgba(201,168,76,0.65);letter-spacing:1px;line-height:1.8;}
.ftr-brand{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;background:linear-gradient(90deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
.disc{margin-top:6px;font-size:9px;color:rgba(237,229,204,0.28);}

/* ── Animations ── */
.fi{animation:fi .55s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.13s}.d3{animation-delay:.2s}.d4{animation-delay:.27s}
</style>
</head>
<body dir="rtl">

<!-- Wait Toast -->
<div class="wait-toast" id="waitToast">
  <div class="wt-title" id="wtTitle">يرجى الانتظار</div>
  <div class="wt-cd" id="wtCd">--</div>
  <div class="wt-sub" id="wtSub">انتظر حتى تنتهي الصفقة</div>
</div>

<div class="page">
  <header class="hdr fi">
    <div class="logo">
      <div class="logo-box logo-burst" id="logoBox" onclick="logoClick()">
        <img src="https://i.postimg.cc/FRdZg1g0/20260325-144030.jpg" alt="Aivex" id="logoImg">
      </div>
      <div class="logo-txts">
        <div class="logo-name">AIVEX</div>
        <div class="logo-vip">VIP</div>
        <div class="logo-sub" data-ar="روبوت أيفيكس برو للتداول الذكي" data-en="Aivex Pro Smart Trading Bot">روبوت أيفيكس برو للتداول الذكي</div>
      </div>
    </div>
    <div class="lang-tog">
      <div class="lopt active" id="l-ar" onclick="setLang('ar')">AR</div>
      <div class="lopt" id="l-en" onclick="setLang('en')">EN</div>
    </div>
  </header>

  <div class="fi d1">
    <label class="flabel" data-ar="اختر الزوج" data-en="Select Pair">اختر الزوج</label>
    <div class="swrap">
      <select id="s-pair" onchange="pairChange()">
        <optgroup label="── OTC ──">

          <option>EUR/CHF OTC</option><option>AUD/CAD OTC</option>
        </optgroup>
        <optgroup label="── REAL ──">
          <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
          <option>USD/CHF</option><option>AUD/USD</option><option>USD/CAD</option>
          <option>NZD/USD</option><option>XAU/USD</option><option>BTC/USD</option><option>ETH/USD</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="fi d2">
    <label class="flabel" data-ar="الإطار الزمني" data-en="Timeframe">الإطار الزمني</label>
    <div class="swrap">
      <select id="s-tf">
        <option value="3s"  data-ar="3 ثواني"  data-en="3 seconds">3 ثواني</option>
        <option value="5s"  data-ar="5 ثواني"  data-en="5 seconds">5 ثواني</option>
        <option value="10s" data-ar="10 ثواني" data-en="10 seconds">10 ثواني</option>
        <option value="15s" data-ar="15 ثانية" data-en="15 seconds">15 ثانية</option>
        <option value="30s" data-ar="30 ثانية" data-en="30 seconds">30 ثانية</option>
        <option value="1"   data-ar="1 دقيقة"  data-en="1 minute">1 دقيقة</option>
        <option value="2"   data-ar="2 دقيقة"  data-en="2 minutes">2 دقيقة</option>
        <option value="3"   data-ar="3 دقائق"  data-en="3 minutes">3 دقائق</option>
        <option value="5"   data-ar="5 دقائق"  data-en="5 minutes">5 دقائق</option>
        <option value="10"  data-ar="10 دقائق" data-en="10 minutes">10 دقائق</option>
        <option value="15"  data-ar="15 دقيقة" data-en="15 minutes">15 دقيقة</option>
        <option value="30"  data-ar="30 دقيقة" data-en="30 minutes">30 دقيقة</option>
        <option value="60"  data-ar="1 ساعة"   data-en="1 hour">1 ساعة</option>
      </select>
    </div>
  </div>

  <div class="fi d3">
    <button class="sig-btn" id="sbtn" onclick="doSignal()">
      <span id="blbl" data-ar="الحصول على إشارة" data-en="Get signal">الحصول على إشارة</span>
    </button>
  </div>

  <div class="sig-card fi d4" id="scard">
    <div class="sc-head">
      <div class="sc-title" data-ar="الإشارة" data-en="Signal">الإشارة</div>
      <div class="sc-time-wrap" id="stimeWrap" style="display:none;">
        <div class="sc-time-dot"></div>
        <div class="sc-time" id="stime"></div>
      </div>
    </div>
    <div class="sc-body">
      <div class="idle-txt" id="idletxt" data-ar='اضغط "الحصول على إشارة"' data-en='Press "Get signal"'>اضغط "الحصول على إشارة"</div>
      <div class="res" id="resbox">
        <div class="res-pair" id="rpair"></div>
        <div class="res-dir-wrap" id="rdirWrap">
          <div class="dir-arrow" id="darrow"></div>
          <div class="res-dir" id="rdir"></div>
        </div>
        <div class="res-meta">
          <div id="rtf"></div>
          <div id="racc"></div>
          <!-- Signal countdown box -->
          <div class="sig-countdown-box hidden" id="sigCdBox">
            <div class="sig-cd-label" id="sigCdLabel">⏱</div>
            <div class="sig-cd-val" id="sigCdVal">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-sec fi d4">
    <div class="chart-head">
      <div class="chart-ttl" data-ar="الرسم البياني" data-en="Chart">الرسم البياني</div>
      <div class="chart-badge" id="cbadge">EUR/USD OTC</div>
    </div>
    <div style="position:relative;">
      <div id="chartbox"></div>
      <div class="candle-timer" id="candleTimer">10s</div>
      <div class="po-badge">
        <img class="po-logo-img" src="https://i.postimg.cc/0jh4fkx9/7685d8464c9b6e3e6bdba81649786ce8-1-.jpg" alt="Pocket Option">
        <div class="po-texts">
          <div class="po-name">POCKET OPTION</div>
          <div class="po-sub">Binary Trading</div>
        </div>
      </div>
      <div id="arrowLayer" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>
    </div>
  </div>

  <div class="ftr">
    <div class="ftr-copy">2026 AIVEX &copy;</div>
    <div class="ftr-rights">
      جميع الحقوق محفوظة لدى فريق<br>
      <span class="ftr-brand">AIVEX TRADING</span>
    </div>
    <div class="disc" data-ar="للأغراض التعليمية فقط — ليست نصيحة مالية" data-en="For educational purposes only — Not financial advice">للأغراض التعليمية فقط — ليست نصيحة مالية</div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
// ─────────────────────────────────────────────
//  Base prices
// ─────────────────────────────────────────────
var P={
  'EUR/USD OTC':1.08432,'GBP/USD OTC':1.27134,'USD/JPY OTC':149.842,
  'AUD/USD OTC':0.64821,'USD/CAD OTC':1.36541,'EUR/GBP OTC':0.85521,
  'EUR/JPY OTC':163.42,'GBP/JPY OTC':191.85,'AUD/NZD OTC':1.0832,
  'USD/RUB OTC':92.5,'CAD/JPY OTC':110.42,'CHF/JPY OTC':167.32,
  'EUR/CHF OTC':0.9621,'AUD/CAD OTC':0.9015,
  'EUR/USD':1.08432,'GBP/USD':1.27134,'USD/JPY':149.842,
  'USD/CHF':0.91234,'AUD/USD':0.64821,'USD/CAD':1.36541,
  'NZD/USD':0.59821,'XAU/USD':2034.5,'BTC/USD':67432.5,'ETH/USD':3241.8
};

var lang='ar',cObj=null,cSer=null,cData=[],cTmr=null,ctCountdown=null;
var bias=null,bcnt=0,busy=false;
var CANDLE_SEC=10;
var candleRemain=CANDLE_SEC;

// ─────────────────────────────────────────────
//  Wait lock system
// ─────────────────────────────────────────────
var waitLock=false;       // true = button locked
var waitTimer=null;       // interval for toast countdown
var sigCdTimer=null;      // interval for signal box countdown

// waitSeconds per timeframe value
var WAIT_SECS={
  '3s':3,'5s':5,'10s':10,'15s':15,'30s':20,
  '1':40,'2':55,'3':75,'5':90,'10':120,'15':150,'30':180,'60':240
};

// ─────────────────────────────────────────────
//  Persist signal
// ─────────────────────────────────────────────
function saveSignal(obj){try{localStorage.setItem('aivex_signal',JSON.stringify(obj));}catch(e){}}
function loadSignal(){try{var s=localStorage.getItem('aivex_signal');return s?JSON.parse(s):null;}catch(e){return null;}}

// ─────────────────────────────────────────────
//  Saudi Arabia time (UTC+3) — plain digits
// ─────────────────────────────────────────────
function getSaudiTime(){
  var now=new Date();
  // Offset to UTC+3
  var utc=now.getTime()+(now.getTimezoneOffset()*60000);
  var sa=new Date(utc+(3*3600000));
  var h=sa.getHours(),m=sa.getMinutes(),s=sa.getSeconds();
  // Pad with leading zero — plain numbers, no fancy chars
  function p(n){return n<10?'0'+n:''+n;}
  return p(h)+':'+p(m)+':'+p(s);
}

// ─────────────────────────────────────────────
//  Logo click
// ─────────────────────────────────────────────
function logoClick(){
  var box=document.getElementById('logoBox');
  box.classList.add('pulse-click');
  setTimeout(function(){box.classList.remove('pulse-click');},650);
}

// ─────────────────────────────────────────────
//  Language
// ─────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.body.dir=l==='ar'?'rtl':'ltr';
  document.documentElement.lang=l;
  document.getElementById('l-ar').classList.toggle('active',l==='ar');
  document.getElementById('l-en').classList.toggle('active',l==='en');
  document.querySelectorAll('[data-ar][data-en]').forEach(function(e){e.textContent=e.dataset[l];});
  document.querySelectorAll('#s-tf option').forEach(function(o){o.textContent=o.dataset[l]||o.textContent;});
  if(!busy&&!waitLock){var b=document.getElementById('blbl');b.textContent=b.dataset[l];}
  if(_lastSig){renderSignal(_lastSig);}
}

// ─────────────────────────────────────────────
//  Pair change
// ─────────────────────────────────────────────
function pairChange(){
  document.getElementById('cbadge').textContent=document.getElementById('s-pair').value;
  initChart();
}

// ─────────────────────────────────────────────
//  Get timeframe in seconds
// ─────────────────────────────────────────────
function getTfSeconds(){
  var v=document.getElementById('s-tf').value;
  if(v.endsWith('s'))return parseInt(v);
  return parseInt(v)*60;
}

// ─────────────────────────────────────────────
//  Format seconds as mm:ss or just ss
// ─────────────────────────────────────────────
function fmtSecs(s){
  if(s>=60){var m=Math.floor(s/60);var r=s%60;return m+':'+(r<10?'0':'')+r;}
  return s+'s';
}

// ─────────────────────────────────────────────
//  Show wait toast with countdown
// ─────────────────────────────────────────────
function showWaitToast(seconds){
  var toast=document.getElementById('waitToast');
  var cdEl=document.getElementById('wtCd');
  var titleEl=document.getElementById('wtTitle');
  var subEl=document.getElementById('wtSub');

  titleEl.textContent=lang==='ar'?'يرجى الانتظار':'Please Wait';
  subEl.textContent=lang==='ar'?'انتظر حتى تنتهي الصفقة':'Wait for the trade to close';

  var remain=seconds;
  cdEl.textContent=fmtSecs(remain);
  toast.classList.add('show');

  if(waitTimer)clearInterval(waitTimer);
  waitTimer=setInterval(function(){
    remain--;
    if(remain<=0){
      clearInterval(waitTimer);waitTimer=null;
      toast.classList.remove('show');
      unlockBtn();
    } else {
      cdEl.textContent=fmtSecs(remain);
    }
  },1000);
}

// ─────────────────────────────────────────────
//  Start signal countdown box (next to signal)
// ─────────────────────────────────────────────
function startSigCountdown(seconds,isBuy){
  if(sigCdTimer)clearInterval(sigCdTimer);
  var box=document.getElementById('sigCdBox');
  var val=document.getElementById('sigCdVal');
  box.className='sig-countdown-box '+(isBuy?'buy-c':'sell-c');
  val.className='sig-cd-val '+(isBuy?'buy-v':'sell-v');

  var remain=seconds;
  val.textContent=fmtSecs(remain);

  sigCdTimer=setInterval(function(){
    remain--;
    if(remain<=0){
      clearInterval(sigCdTimer);sigCdTimer=null;
      box.classList.add('hidden');
    } else {
      val.textContent=fmtSecs(remain);
    }
  },1000);
}

// ─────────────────────────────────────────────
//  Lock / unlock button
// ─────────────────────────────────────────────
function lockBtn(tfv){
  waitLock=true;
  var btn=document.getElementById('sbtn');
  var lbl=document.getElementById('blbl');
  btn.classList.add('locked');
  btn.disabled=true;
  lbl.dataset.ar='انتظر حتى تنتهي الصفقة';
  lbl.dataset.en='Wait for trade to close';
  lbl.textContent=lang==='ar'?'انتظر حتى تنتهي الصفقة':'Wait for trade to close';
}

function unlockBtn(){
  waitLock=false;
  var btn=document.getElementById('sbtn');
  var lbl=document.getElementById('blbl');
  btn.classList.remove('locked');
  btn.disabled=false;
  lbl.dataset.ar='إشارة جديدة';
  lbl.dataset.en='New Signal';
  lbl.textContent=lang==='ar'?'إشارة جديدة':'New Signal';
}

// ─────────────────────────────────────────────
//  Build realistic candles
// ─────────────────────────────────────────────
function mkCandles(n,base){
  var now=Math.floor(Date.now()/1000);
  var p=base,out=[];
  var streak=0,dir=1;
  for(var i=n;i>=0;i--){
    var v=base*0.00085;
    var maxStreak=1+Math.floor(Math.random()*2);
    if(streak>=maxStreak){dir=-dir;streak=0;}else{streak++;}
    if(Math.random()<0.18){dir=-dir;streak=0;}
    var bodySize=(0.4+Math.random()*0.9)*v;
    var o=p;var c=o+dir*bodySize;
    var wickUp=Math.random()*v*0.5;var wickDown=Math.random()*v*0.5;
    out.push({time:now-i*CANDLE_SEC,open:parseFloat(o.toFixed(5)),high:parseFloat((Math.max(o,c)+wickUp).toFixed(5)),low:parseFloat((Math.min(o,c)-wickDown).toFixed(5)),close:parseFloat(c.toFixed(5))});
    p=c;
  }
  return out;
}

// ─────────────────────────────────────────────
//  Init chart
// ─────────────────────────────────────────────
function initChart(){
  if(cTmr){clearInterval(cTmr);cTmr=null;}
  if(ctCountdown){clearInterval(ctCountdown);ctCountdown=null;}
  if(cObj){try{cObj.remove();}catch(e){}cObj=null;cSer=null;}
  cData=[];clearArrows();
  _tickStreak=0;_tickDir=1;
  candleRemain=CANDLE_SEC;updateTimerDisplay();
  var el=document.getElementById('chartbox');
  el.innerHTML='';
  var pair=document.getElementById('s-pair').value;
  var base=P[pair]||1.0843;
  var w=el.offsetWidth||el.parentElement.offsetWidth||470;
  if(w<50)w=470;
  try{
    cObj=LightweightCharts.createChart(el,{
      width:w,height:300,
      layout:{background:{color:'transparent'},textColor:'rgba(237,229,204,0.42)'},
      grid:{vertLines:{color:'rgba(0,80,180,0.10)'},horzLines:{color:'rgba(0,80,180,0.10)'}},
      crosshair:{mode:1},
      rightPriceScale:{borderColor:'rgba(201,168,76,0.15)'},
      timeScale:{borderColor:'rgba(201,168,76,0.15)',timeVisible:true,secondsVisible:true}
    });
    cSer=cObj.addCandlestickSeries({
      upColor:'#00FF9D',downColor:'#FF3D5A',
      borderUpColor:'#00FF9D',borderDownColor:'#FF3D5A',
      wickUpColor:'rgba(0,255,157,0.6)',wickDownColor:'rgba(255,61,90,0.6)'
    });
    cData=mkCandles(80,base);
    cSer.setData(cData);
    cObj.timeScale().fitContent();
    startCandleTick(base);
    window.onresize=function(){if(cObj){var nw=el.offsetWidth||470;cObj.applyOptions({width:nw});}};
  }catch(err){console.error('Chart error:',err);}
}

// ─────────────────────────────────────────────
//  Candle countdown display
// ─────────────────────────────────────────────
function updateTimerDisplay(){
  var el=document.getElementById('candleTimer');
  if(el){el.textContent=candleRemain+'s';}
}

function startCandleTick(base){
  candleRemain=CANDLE_SEC;updateTimerDisplay();
  ctCountdown=setInterval(function(){
    candleRemain--;
    if(candleRemain<0)candleRemain=CANDLE_SEC;
    updateTimerDisplay();
  },1000);
  cTmr=setInterval(function(){tick(base);candleRemain=CANDLE_SEC;},CANDLE_SEC*1000);
}

var _tickStreak=0,_tickDir=1,_tickMaxStreak=1;
function tick(base){
  if(!cSer||!cData.length)return;
  try{
    var last=cData[cData.length-1];
    var v=base*0.00085;
    if(_tickStreak===0)_tickMaxStreak=1+Math.floor(Math.random()*2);
    _tickStreak++;
    if(_tickStreak>_tickMaxStreak){_tickDir=-_tickDir;_tickStreak=1;_tickMaxStreak=1+Math.floor(Math.random()*2);}
    if(bias==='buy'&&bcnt>0){_tickDir=1;bcnt--;}
    if(bias==='sell'&&bcnt>0){_tickDir=-1;bcnt--;}
    var bodySize=(0.35+Math.random()*0.9)*v;
    var o=last.close;var c=o+_tickDir*bodySize;
    var wickUp=Math.random()*v*0.5;var wickDown=Math.random()*v*0.5;
    var nc={time:last.time+CANDLE_SEC,open:parseFloat(o.toFixed(5)),high:parseFloat((Math.max(o,c)+wickUp).toFixed(5)),low:parseFloat((Math.min(o,c)-wickDown).toFixed(5)),close:parseFloat(c.toFixed(5))};
    cData.push(nc);if(cData.length>100)cData.shift();
    cSer.setData(cData);
  }catch(e){}
}

// ─────────────────────────────────────────────
//  Arrow on chart
// ─────────────────────────────────────────────
var arrowTimeouts=[];
function clearArrows(){
  var layer=document.getElementById('arrowLayer');
  if(layer)layer.innerHTML='';
  arrowTimeouts.forEach(function(t){clearTimeout(t);});arrowTimeouts=[];
}
function placeArrow(isBuy){
  clearArrows();
  var layer=document.getElementById('arrowLayer');if(!layer)return;
  var el=document.createElement('div');
  el.className='chart-arrow '+(isBuy?'up':'down');
  if(isBuy){el.innerHTML='<div class="arrow-head">▲</div><div class="arrow-body"></div>';el.style.left='70%';el.style.top='55%';}
  else{el.innerHTML='<div class="arrow-body"></div><div class="arrow-head">▼</div>';el.style.left='70%';el.style.top='18%';}
  layer.appendChild(el);
  var tfSec=getTfSeconds();var durationMs=Math.max(tfSec*1000,4000);
  var t1=setTimeout(function(){el.classList.add('fading');var t2=setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},700);arrowTimeouts.push(t2);},durationMs);
  arrowTimeouts.push(t1);
}

// ─────────────────────────────────────────────
//  Timeframe label map
// ─────────────────────────────────────────────
var tfLabels={
  '3s':{ar:'3 ثواني',en:'3 sec'},'5s':{ar:'5 ثواني',en:'5 sec'},
  '10s':{ar:'10 ثواني',en:'10 sec'},'15s':{ar:'15 ثانية',en:'15 sec'},
  '30s':{ar:'30 ثانية',en:'30 sec'},'1':{ar:'1 دقيقة',en:'1 min'},
  '2':{ar:'2 دقيقة',en:'2 min'},'3':{ar:'3 دقائق',en:'3 min'},
  '5':{ar:'5 دقائق',en:'5 min'},'10':{ar:'10 دقائق',en:'10 min'},
  '15':{ar:'15 دقيقة',en:'15 min'},'30':{ar:'30 دقيقة',en:'30 min'},
  '60':{ar:'1 ساعة',en:'1 hr'}
};

var _lastSig=null;

// ─────────────────────────────────────────────
//  Render signal
// ─────────────────────────────────────────────
function renderSignal(sig){
  _lastSig=sig;
  var isBuy=sig.dir==='buy';
  document.getElementById('stime').textContent=sig.time;
  document.getElementById('stimeWrap').style.display='inline-flex';
  document.getElementById('rpair').textContent=sig.pair;
  var wrap=document.getElementById('rdirWrap');
  wrap.className='res-dir-wrap '+(isBuy?'buy':'sell');
  var darrow=document.getElementById('darrow');
  darrow.className='dir-arrow '+(isBuy?'buy':'sell');
  darrow.textContent=isBuy?'▲':'▼';
  var rd=document.getElementById('rdir');
  rd.textContent=isBuy?(lang==='ar'?'شراء':'BUY'):(lang==='ar'?'بيع':'SELL');
  rd.className='res-dir '+(isBuy?'buy':'sell');
  document.getElementById('rtf').innerHTML=(lang==='ar'?'الإطار: ':'TF: ')+'<span>'+(tfLabels[sig.tfv]||{ar:sig.tfv,en:sig.tfv})[lang]+'</span>';
  document.getElementById('racc').innerHTML=(lang==='ar'?'الدقة: ':'Acc: ')+'<span class="acc">'+sig.acc+'%</span>';
  document.getElementById('idletxt').style.display='none';
  document.getElementById('resbox').style.display='flex';
  document.getElementById('scard').className='sig-card '+(isBuy?'buy':'sell');
}

// ─────────────────────────────────────────────
//  Do Signal
// ─────────────────────────────────────────────
function doSignal(){
  if(busy||waitLock)return;

  var tfv=document.getElementById('s-tf').value;
  var waitSec=WAIT_SECS[tfv]||5;

  busy=true;
  var btn=document.getElementById('sbtn');
  var lbl=document.getElementById('blbl');
  btn.classList.add('waiting');btn.disabled=true;
  lbl.innerHTML='<span class="spn"></span>'+(lang==='ar'?'جاري التحليل...':'Analyzing...');
  document.getElementById('idletxt').style.display='block';
  document.getElementById('resbox').style.display='none';
  document.getElementById('scard').className='sig-card';
  document.getElementById('stime').textContent='';
  document.getElementById('stimeWrap').style.display='none';
  // Hide sig countdown box
  document.getElementById('sigCdBox').classList.add('hidden');

  setTimeout(function(){
    var isBuy=Math.random()>.5;
    var acc=(85+Math.random()*13).toFixed(2);
    var pair=document.getElementById('s-pair').value;
    bias=isBuy?'buy':'sell';bcnt=8;

    // Saudi time
    var timeStr=getSaudiTime();

    var sig={dir:isBuy?'buy':'sell',pair:pair,tfv:tfv,acc:acc,time:timeStr};
    saveSignal(sig);
    renderSignal(sig);

    setTimeout(function(){placeArrow(isBuy);},300);

    // Start signal countdown box
    startSigCountdown(waitSec,isBuy);

    // Lock button + show wait toast
    lockBtn(tfv);
    showWaitToast(waitSec);

    btn.classList.remove('waiting');
    busy=false;
  },1200);
}

// ─────────────────────────────────────────────
//  On load
// ─────────────────────────────────────────────
window.addEventListener('load',function(){
  setTimeout(function(){
    initChart();
    var saved=loadSignal();
    if(saved){_lastSig=saved;renderSignal(saved);}
  },200);
});
</script>
</body>
</html>
